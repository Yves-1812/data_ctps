<style>
:root{

  --page:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#6b6a65;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --hover:#1c5cab; --wash:rgba(42,120,214,.08);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19;
    --ink:#f0efec; --ink2:#c3c2b7; --ink3:#a3a299;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --hover:#5598e7; --wash:rgba(57,135,229,.12);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19;
  --ink:#f0efec; --ink2:#c3c2b7; --ink3:#a3a299;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --hover:#5598e7; --wash:rgba(57,135,229,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font:400 14px/1.5 var(--font);
  padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
h1{margin:0;font-size:clamp(26px,4.6vw,38px);line-height:1.1;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--ink2);font-size:15px;max-width:60ch}
.pill{font-size:12.5px;font-weight:500;color:var(--ink2);border:1px solid var(--grid);border-radius:999px;padding:4px 12px;white-space:nowrap}

.summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:20px;align-items:stretch}
.hero{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:8px 0}
.hero-fig{font-size:clamp(64px,11vw,96px);line-height:.95;font-weight:700;letter-spacing:-.04em}
.hero-txt{margin:0;color:var(--ink2);font-size:15px;max-width:34ch}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--grid);border:1px solid var(--ring);border-radius:12px;overflow:hidden}
.tile{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kl{font-size:12.5px;color:var(--ink2)}
.kv{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kn{font-size:12.5px;color:var(--ink3)}
@media (max-width:760px){.summary{grid-template-columns:minmax(0,1fr)}}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px}
.card{min-width:0;background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.wide{grid-column:1/-1}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h2{margin:0;font-size:15px;font-weight:600;line-height:1.3;text-wrap:balance}
.csub{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--grid);border-radius:8px;overflow:hidden;flex:none}
.seg button{font:500 12px var(--font);padding:4px 10px;border:0;background:transparent;color:var(--ink2);cursor:pointer}
.seg button+button{border-left:1px solid var(--grid)}
.seg button[aria-pressed="true"]{background:var(--wash);color:var(--ink);font-weight:600}

.sh{margin:8px 0 2px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.sh:first-child{margin-top:0}
.hbars{display:flex;flex-direction:column;gap:2px}
.hrow{display:grid;grid-template-columns:minmax(104px,38%) minmax(0,1fr);align-items:center;gap:12px;min-height:34px;padding:2px 8px;margin:0 -8px;border-radius:6px}
.hrow:hover,.hrow:focus-visible{background:var(--wash)}
.hl{font-size:13px;line-height:1.3}
.track{position:relative;height:16px;margin-right:84px;border-left:1px solid var(--axis)}
.bar{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0}
.hrow:hover .bar,.hrow:focus-visible .bar{background:var(--hover)}
.val{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12.5px}
.val b{font-weight:600}
.val span{color:var(--ink3)}

.cwrap{display:grid;grid-template-columns:34px minmax(0,1fr);grid-template-rows:190px auto;column-gap:8px;row-gap:6px}
.yax{position:relative}
.yax span{position:absolute;right:0;transform:translateY(50%);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.cplot{position:relative}
.gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--grid)}
.gl.z{border-top-color:var(--axis)}
.ccols{position:absolute;inset:0;display:grid}
.ccol{position:relative;border-radius:6px}
.ccol:hover,.ccol:focus-visible{background:var(--wash)}
.cbar{position:absolute;bottom:0;left:50%;width:24px;margin-left:-12px;background:var(--s1);border-radius:4px 4px 0 0}
.ccol:hover .cbar,.ccol:focus-visible .cbar{background:var(--hover)}
.cval{position:absolute;left:0;right:0;text-align:center;font-size:12.5px;font-weight:600}
.xax{display:grid}
.xl{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.xt{font-size:12.5px;font-weight:500;line-height:1.3}
.xn{font-size:11.5px;color:var(--ink3)}

table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--grid);font-size:13px}
th{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table.big{min-width:1180px}
td.long{min-width:210px}
td.nm{white-space:nowrap;font-weight:500}
.mcell{display:flex;align-items:center;gap:10px;min-width:170px}
.meter{flex:1;height:6px;background:var(--wash);border-radius:3px;min-width:60px}
.meter i{display:block;height:100%;background:var(--s1);border-radius:3px}
.mcell span{font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.dim{color:var(--ink3)}

.notes{font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:6px;max-width:80ch}
.notes p{margin:0}

.tip{position:fixed;z-index:30;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.35;max-width:260px}
.tip-v{font-weight:700;font-size:14px}
.tip-l{display:flex;align-items:center;gap:6px;opacity:.85}
.tip-l::before{content:"";width:10px;height:2px;background:var(--s1);flex:none}
</style>

function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function fmt(x){ return String(x).replace('.', ','); }
function pc(x){ return fmt(x) + '%'; }
function f1(x){ return x.toFixed(1).replace('.', ','); }
function f2(x){ return x.toFixed(2).replace('.', ','); }
function sumN(rows){ return rows.reduce(function(a, r){ return a + r.n; }, 0); }
function pct(n){ return Math.round(n / S.N * 1000) / 10; }

function hbars(rows, max){
  var wrap = el('div', 'hbars');
  rows.forEach(function(r){
    var row = el('div', 'hrow');
    row.tabIndex = 0;
    row.setAttribute('role', 'img');
    row.setAttribute('aria-label', r.label + ': ' + pc(r.pct) + ', ' + r.n + ' responden');
    row.dataset.tipv = pc(r.pct) + ' · ' + r.n + ' responden';
    row.dataset.tipl = r.label;
    var track = el('div', 'track');
    var w = r.pct / max * 100;
    var bar = el('div', 'bar'); bar.style.width = w + '%';
    var val = el('div', 'val'); val.style.left = 'calc(' + w + '% + 8px)';
    val.append(el('b', null, pc(r.pct)), el('span', null, ' (' + r.n + ')'));
    track.append(bar, val);
    row.append(el('div', 'hl', r.label), track);
    wrap.append(row);
  });
  return wrap;
}

function cols(rows, ymax, ticks){
  var wrap = el('div', 'cwrap');
  var yax = el('div', 'yax');
  var plot = el('div', 'cplot');
  ticks.forEach(function(t){
    var l = el('span', null, String(t)); l.style.bottom = (t / ymax * 100) + '%'; yax.append(l);
    var g = el('div', t === 0 ? 'gl z' : 'gl'); g.style.bottom = (t / ymax * 100) + '%'; plot.append(g);
  });
  var cc = el('div', 'ccols');
  cc.style.gridTemplateColumns = 'repeat(' + rows.length + ',1fr)';
  rows.forEach(function(r){
    var c = el('div', 'ccol');
    c.tabIndex = 0;
    c.setAttribute('role', 'img');
    c.setAttribute('aria-label', r.label + ': ' + pc(r.pct) + ', ' + r.n + ' responden');
    c.dataset.tipv = pc(r.pct) + ' · ' + r.n + ' responden';
    c.dataset.tipl = r.label;
    var h = r.n / ymax * 100;
    var bar = el('div', 'cbar'); bar.style.height = h + '%';
    var v = el('div', 'cval', pc(r.pct)); v.style.bottom = 'calc(' + h + '% + 4px)';
    c.append(bar, v);
    cc.append(c);
  });
  plot.append(cc);
  var xax = el('div', 'xax');
  xax.style.gridTemplateColumns = 'repeat(' + rows.length + ',1fr)';
  rows.forEach(function(r){
    var x = el('div', 'xl');
    x.append(el('span', 'xt', r.label), el('span', 'xn', 'n=' + r.n));
    xax.append(x);
  });
  wrap.append(yax, plot, el('div'), xax);
  return wrap;
}

function miniTable(groups){
  var t = el('table');
  var hd = el('thead'), hr = el('tr');
  [['Kategori', ''], ['Persen', 'num'], ['Responden', 'num']].forEach(function(h){
    var th = el('th', h[1], h[0]); th.scope = 'col'; hr.append(th);
  });
  hd.append(hr); t.append(hd);
  var tb = el('tbody');
  groups.forEach(function(g){
    if (g.title){
      var gr = el('tr'); var gt = el('td', 'dim', g.title); gt.colSpan = 3; gr.append(gt); tb.append(gr);
    }
    g.rows.forEach(function(r){
      var tr = el('tr');
      tr.append(el('td', null, r.label), el('td', 'num', pc(r.pct)), el('td', 'num', String(r.n)));
      tb.append(tr);
    });
  });
  t.append(tb);
  return t;
}

var tip = document.getElementById('tip');
function hideTip(){ tip.hidden = true; }
function placeTip(x, y){
  var w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8)) + 'px';
  tip.style.top = Math.max(8, y - h - 12) + 'px';
}
function showTip(m, x, y){
  tip.replaceChildren(el('div', 'tip-v', m.dataset.tipv), el('div', 'tip-l', m.dataset.tipl));
  tip.hidden = false;
  placeTip(x, y);
}

function buildCard(c, i){
  var sec = el('section', 'card' + (c.wide ? ' wide' : ''));
  var head = el('div', 'chead');
  var tw = el('div');
  tw.append(el('h2', null, c.title), el('p', 'csub', c.sub));
  var seg = el('div', 'seg');
  var bg = el('button', null, 'Grafik'), bt = el('button', null, 'Tabel');
  bg.type = 'button'; bt.type = 'button';
  bg.id = 'seg-g-' + i; bt.id = 'seg-t-' + i;
  seg.append(bg, bt);
  head.append(tw, seg);
  var body = el('div');
  sec.append(head, body);
  function chart(){
    if (c.kind === 'c') return cols(c.groups[0].rows, c.ymax, c.ticks);
    var f = document.createDocumentFragment();
    c.groups.forEach(function(g){
      if (g.title) f.append(el('div', 'sh', g.title));
      f.append(hbars(g.rows, c.max));
    });
    var d = el('div'); d.append(f); return d;
  }
  function show(mode){
    body.replaceChildren(mode === 'tabel' ? miniTable(c.groups) : chart());
    bg.setAttribute('aria-pressed', String(mode !== 'tabel'));
    bt.setAttribute('aria-pressed', String(mode === 'tabel'));
    hideTip();
  }
  bg.addEventListener('click', function(){ show('grafik'); });
  bt.addEventListener('click', function(){ show('tabel'); });
  show('grafik');
  return sec;
}

});

});
